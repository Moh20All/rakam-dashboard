<style>
/* Same design system as the landing page: graphite ground, Board green, solder-flux lime; dark-first with a light variant.
   Layout: sticky header, then a chapter list (sticky on wide screens) beside one reading column. */
:root {
  color-scheme: dark;
  --bg: #1A1F1D; --raised: #232A26; --sunk: #141816; --text: #F3F1EA; --mute: #A3B4AB; --line: #2C3430;
  --gold: #C6EB3F; --gold-hi: #D6F36E; --gold-ink: #14201B;
  --cta: #C6EB3F; --cta-hi: #D6F36E; --cta-ink: #14201B; --cta-edge: #3B4A08;
  --ok: #6FD39A; --warn: #F2C062; --bad: #FF8A80; --wa: #3FCF7E;
  --note-bg: color-mix(in srgb, var(--gold) 9%, transparent);
  --warn-bg: color-mix(in srgb, var(--warn) 10%, transparent);
  --f-body: "IBM Plex Sans", "IBM Plex Sans Arabic", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --f-ar: "IBM Plex Sans Arabic", "IBM Plex Sans", "Segoe UI", sans-serif;
  --r: 14px;
  --head: 64px;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #F3F1EA; --raised: #FFFFFF; --sunk: #EAE6DB; --text: #14201B; --mute: #535C56; --line: #DDD7C9;
    --gold: #0F4F3C; --gold-hi: #1B6FD8; --gold-ink: #FFFFFF; --ok: #17633B; --warn: #8A5300; --bad: #B3261E; --wa: #1D7A4B;
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #F3F1EA; --raised: #FFFFFF; --sunk: #EAE6DB; --text: #14201B; --mute: #535C56; --line: #DDD7C9;
  --gold: #0F4F3C; --gold-hi: #1B6FD8; --gold-ink: #FFFFFF; --ok: #17633B; --warn: #8A5300; --bad: #B3261E; --wa: #1D7A4B;
}
:root[data-theme="dark"] { color-scheme: dark; }

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: calc(var(--head) + 16px); }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 1rem/1.7 var(--f-body); -webkit-font-smoothing: antialiased; }
html[lang="ar"] body { font-family: var(--f-ar); }
h1, h2, h3 { margin: 0; letter-spacing: -.02em; line-height: 1.15; text-wrap: balance; }
html[lang="ar"] h1, html[lang="ar"] h2, html[lang="ar"] h3 { letter-spacing: 0; line-height: 1.4; }
p { margin: 0; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 3px; border-radius: 6px; }
.eyebrow { font: 500 .8125rem/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
html[lang="ar"] .eyebrow { letter-spacing: 0; font-family: var(--f-ar); font-weight: 600; }
.wrap { max-width: 1240px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 720px) { .wrap { padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); } }

/* ---------- Header ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 16px; height: var(--head); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font: 700 1.0625rem/1 var(--f-body); }
.brand img { width: 32px; height: 32px; display: block; }
.brand .ar { font-family: var(--f-ar); color: var(--gold); }
.brand .tag { font: 500 .75rem/1 var(--f-mono); color: var(--mute); border: 1px solid var(--line); border-radius: 6px; padding: 4px 7px; }
html[lang="ar"] .brand .tag { font-family: var(--f-ar); }
.top nav { display: none; gap: 22px; margin-inline-start: auto; font-size: .9375rem; color: var(--mute); }
.top nav a { text-decoration: none; }
.top nav a:hover { color: var(--text); }
@media (min-width: 960px) { .top nav { display: flex; } }
.langs { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 999px; margin-inline-start: auto; }
@media (min-width: 960px) { .langs { margin-inline-start: 6px; } }
.langs button { all: unset; cursor: pointer; padding: 5px 10px; border-radius: 999px; font: 500 .8125rem/1 var(--f-mono); color: var(--mute); }
.langs button[aria-pressed="true"] { background: var(--gold); color: var(--gold-ink); }
.langs button:focus-visible { outline: 2px solid var(--gold-hi); }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 8px; font: 600 .9375rem/1 var(--f-body); text-decoration: none; border: 1px solid transparent; cursor: pointer; }
.btn-cta { background: var(--cta); color: var(--cta-ink); border-color: var(--cta-edge); }
.btn-cta:hover { background: var(--cta-hi); }
.btn-ghost { border-color: var(--line); color: var(--text); background: transparent; }
.btn-ghost:hover { background: var(--raised); }
.top .btn { display: none; }
@media (min-width: 600px) { .top .btn { display: inline-flex; } }

/* ---------- Intro ---------- */
.intro { position: relative; overflow: hidden; border-bottom: 1px solid var(--line); }
.intro::before { content: ""; position: absolute; top: -190px; inset-inline-end: -170px; width: 280px; height: 280px; border-radius: 50%; background: var(--cta); pointer-events: none; }
@media (min-width: 900px) { .intro::before { top: -150px; inset-inline-end: -110px; width: 320px; height: 320px; } }
.intro .wrap { position: relative; padding-block: 56px 48px; display: grid; gap: 22px; }
@media (min-width: 900px) { .intro .wrap { padding-block: 80px 64px; } }
.intro h1 { font-size: clamp(2.2rem, 5vw, 3.8rem); font-weight: 800; max-width: 16ch; }
.intro h1 em { font-style: normal; color: var(--gold); }
.intro .lede { color: var(--mute); max-width: 62ch; font-size: 1.125rem; }
.search { position: relative; max-width: 560px; margin-top: 6px; }
.search svg { position: absolute; inset-inline-start: 16px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--mute); pointer-events: none; }
.search input { width: 100%; padding: 15px 18px; padding-inline-start: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--raised); color: var(--text); font: 400 1rem/1.3 var(--f-body); }
.search input::placeholder { color: var(--mute); }
.search input:focus { outline: 2px solid var(--gold); outline-offset: 0; border-color: transparent; }
.quick { display: grid; gap: 12px; margin-top: 14px; }
@media (min-width: 640px) { .quick { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1040px) { .quick { grid-template-columns: repeat(4, 1fr); } }
.quick a { display: grid; gap: 6px; padding: 18px; border-radius: var(--r); border: 1px solid var(--line); background: var(--bg); text-decoration: none; transition: border-color .2s, transform .2s; }
.quick a:hover { border-color: var(--gold); transform: translateY(-2px); }
.quick b { font-size: 1.0625rem; }
.quick span { color: var(--mute); font-size: .875rem; line-height: 1.5; }
.quick i { font: 500 .75rem/1 var(--f-mono); font-style: normal; color: var(--gold); }

/* ---------- Layout ---------- */
.layout { display: grid; gap: 40px; padding-block: 40px 80px; }
@media (min-width: 1040px) { .layout { grid-template-columns: 260px minmax(0, 1fr); gap: 56px; } }
.toc { display: none; }
@media (min-width: 1040px) {
  .toc { display: block; position: sticky; top: calc(var(--head) + 24px); align-self: start; max-height: calc(100vh - var(--head) - 48px); overflow-y: auto; padding-inline-end: 6px; }
}
.toc .grp { font: 500 .6875rem/1.5 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--mute); margin: 18px 0 6px; }
html[lang="ar"] .toc .grp { letter-spacing: 0; font-family: var(--f-ar); font-weight: 600; font-size: .75rem; }
.toc .grp:first-child { margin-top: 0; }
.toc a { display: flex; gap: 10px; align-items: baseline; padding: 6px 10px; border-radius: 8px; text-decoration: none; color: var(--mute); font-size: .9375rem; line-height: 1.35; }
.toc a span { font: 500 .75rem/1 var(--f-mono); color: inherit; opacity: .7; min-width: 2ch; }
.toc a:hover { color: var(--text); background: var(--raised); }
.toc a[aria-current="true"] { color: var(--text); background: color-mix(in srgb, var(--gold) 14%, transparent); }
.toc a[hidden] { display: none; }
/* Small screens: chapter picker instead of the side list */
.picker { display: block; }
@media (min-width: 1040px) { .picker { display: none; } }
.picker select { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--raised); color: var(--text); font: 500 .9375rem/1.3 var(--f-body); }

/* ---------- Chapters ---------- */
.chap { padding-block: 8px 56px; border-bottom: 1px solid var(--line); margin-bottom: 48px; display: grid; gap: 22px; min-width: 0; }
.chap:last-of-type { border-bottom: 0; }
.chap > header { display: grid; gap: 12px; }
.chap h2 { font-size: clamp(1.75rem, 3.2vw, 2.4rem); font-weight: 700; }
.chap .lede { color: var(--mute); font-size: 1.0625rem; max-width: 70ch; }
.badges { display: flex; flex-wrap: wrap; gap: 8px; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font: 600 .75rem/1.4 var(--f-body); border: 1px solid var(--line); color: var(--mute); }
.badge.vip { border-color: var(--gold); color: var(--gold); }
.badge.owner::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
.badge.new { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }
.chap h3 { font-size: 1.25rem; font-weight: 700; margin-top: 8px; }
.chap p.txt { max-width: 72ch; }
.chap p.txt b, .chap li b { font-weight: 600; }
.steps { counter-reset: s; list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; max-width: 76ch; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; }
.steps li::before { content: counter(s); display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--gold); color: var(--gold); font: 600 .8125rem/1 var(--f-mono); margin-top: 1px; }
.dots { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; max-width: 76ch; }
.dots li { display: grid; grid-template-columns: 18px 1fr; gap: 10px; }
.dots li::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); margin-top: .65em; }
kbd { display: inline-block; min-width: 1.6em; text-align: center; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line); border-bottom-width: 2px; background: var(--raised); font: 500 .8125rem/1.4 var(--f-mono); color: var(--text); white-space: nowrap; }
.ui { font-weight: 600; color: var(--text); background: var(--raised); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; white-space: nowrap; }
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.flow span { padding: 5px 12px; border-radius: 999px; background: var(--raised); border: 1px solid var(--line); font-size: .875rem; font-weight: 500; }
.flow span.end { border-color: var(--gold); color: var(--gold); }
.flow i { font-style: normal; color: var(--mute); }
html[dir="rtl"] .flow i { transform: scaleX(-1); display: inline-block; }
.note, .warn { border-radius: 12px; padding: 14px 16px; display: grid; grid-template-columns: 22px 1fr; gap: 10px; max-width: 80ch; font-size: .9375rem; }
.note { background: var(--note-bg); border: 1px solid color-mix(in srgb, var(--gold) 30%, transparent); }
.warn { background: var(--warn-bg); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); }
.note::before, .warn::before { font: 700 .9375rem/1.6 var(--f-mono); }
.note::before { content: "i"; color: var(--gold); text-align: center; }
.warn::before { content: "!"; color: var(--warn); text-align: center; }

/* Screenshot in a window frame; click to enlarge */
.shot { margin: 4px 0; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--sunk); box-shadow: 0 24px 50px -28px rgba(0,0,0,.6); }
.shot .bar { display: flex; align-items: center; gap: 6px; padding: 9px 12px; border-bottom: 1px solid var(--line); background: var(--raised); font: 500 .75rem/1 var(--f-mono); color: var(--mute); }
html[lang="ar"] .shot .bar { font-family: var(--f-ar); }
.shot .bar i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.shot .bar span { margin-inline-start: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shot button { all: unset; display: block; width: 100%; cursor: zoom-in; }
.shot img { display: block; width: 100%; height: auto; aspect-ratio: 1440 / 900; }
.shot figcaption { padding: 10px 14px; font-size: .8125rem; color: var(--mute); border-top: 1px solid var(--line); }
.pair { display: grid; gap: 16px; }
@media (min-width: 900px) { .pair { grid-template-columns: 1fr 1fr; } }

.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; max-width: 100%; }
.tbl table { border-collapse: collapse; width: 100%; font-size: .9375rem; }
.tbl th, .tbl td { padding: 10px 14px; text-align: start; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font: 500 .75rem/1.3 var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--mute); background: var(--raised); }
html[lang="ar"] .tbl th { font-family: var(--f-ar); letter-spacing: 0; font-size: .8125rem; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td:first-child { white-space: nowrap; }

details.faq { border-bottom: 1px solid var(--line); max-width: 80ch; }
details.faq summary { cursor: pointer; list-style: none; padding: 16px 0; display: flex; justify-content: space-between; gap: 16px; font-weight: 600; }
details.faq summary::-webkit-details-marker { display: none; }
details.faq summary::after { content: "+"; font: 400 1.4rem/1 var(--f-mono); color: var(--gold); transition: transform .2s; }
details.faq[open] summary::after { transform: rotate(45deg); }
details.faq p { padding-bottom: 18px; color: var(--mute); }

.plans { display: grid; gap: 14px; }
@media (min-width: 860px) { .plans { grid-template-columns: repeat(3, 1fr); } }
.plan { border: 1px solid var(--line); border-radius: var(--r); padding: 22px 20px; display: grid; gap: 10px; align-content: start; }
.plan.vip { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
.plan h3 { margin: 0; font-size: 1.125rem; }
.plan .price { font: 700 1.6rem/1.1 var(--f-body); color: var(--gold); }
.plan .price small { display: block; font: 400 .875rem/1.4 var(--f-body); color: var(--mute); margin-top: 4px; }
.plan ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; font-size: .9375rem; }
.plan li { display: flex; gap: 8px; }
.plan li::before { content: "✓"; color: var(--gold); font-weight: 700; }

.empty { display: grid; gap: 10px; padding: 32px; border: 1px dashed var(--line); border-radius: var(--r); color: var(--mute); text-align: center; }
.empty[hidden] { display: none; }
.chap[hidden] { display: none; }

.help { border: 1px solid var(--line); border-radius: var(--r); padding: 28px 24px; display: grid; gap: 12px; background: var(--raised); }
.help h2 { font-size: 1.5rem; }
.help p { color: var(--mute); }
.help .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
.wa-link { background: #0f2a1f; color: #c9f5da; border-color: #1f5a3d; }
.wa-link:hover { background: #133627; }

footer { border-top: 1px solid var(--line); }
footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; padding-block: 26px; color: var(--mute); font-size: .8125rem; }

.top-btn { position: fixed; inset-inline-end: 18px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--raised); color: var(--text); cursor: pointer; display: grid; place-items: center; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
.top-btn.show { opacity: 1; pointer-events: auto; }

dialog.zoom { border: 0; padding: 0; background: transparent; max-width: min(1440px, 96vw); width: 96vw; }
dialog.zoom::backdrop { background: rgba(8, 10, 9, .86); }
dialog.zoom img { width: 100%; height: auto; border-radius: 10px; display: block; }
dialog.zoom button { position: absolute; top: 10px; inset-inline-end: 10px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 1.4rem; cursor: pointer; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
  html { scroll-behavior: auto; }
}
@media print {
  .top, .toc, .picker, .search, .quick, .top-btn, .help .row { display: none !important; }
  body { background: #fff; color: #000; }
  .chap { break-inside: avoid-page; }
}
</style>
</head>

<header class="top">
  <div class="wrap">
    <a class="brand" href="/" aria-label="Warshati">
      <img src="/mark-trace-tile.svg" alt="">

<script>
/* ---------------------------------------------------------------
   Texts. The page is built from these: the frame (T) and the chapters (C), in French, Arabic and English.
   Chapter blocks: p (paragraph), steps (numbered), list (bullets), note, warn, flow (status chain),
   shot / pair (screenshots, files in /assets/guide/<name>-<lang>.webp), table, faq, plans.
   --------------------------------------------------------------- */
const T = {
fr: {
  tag: "Guide", nav_home: "Accueil", nav_price: "Prix", nav_help: "Aide", cta: "S'inscrire",
  eyebrow: "Guide d'utilisation · Warshati 1.6",
  title: "Tout Warshati, <em>pas à pas.</em>",
  lede: "Comment installer Warshati, recevoir une réparation, vendre au comptoir, suivre les dettes et fermer la caisse le soir. Chaque chapitre montre l'écran tel que vous le verrez.",
  search: "Chercher dans le guide… ex. dette, imprimante, mot de passe",
  toc: "Chapitres", empty: "Aucun chapitre ne parle de « {q} ».", empty_help: "Posez la question sur WhatsApp, on vous répond.",
  zoom: "Cliquer pour agrandir",
  groups: { start: "Démarrer", repairs: "Réparations", sales: "Ventes et stock", money: "Argent", admin: "Réglages", more: "Plus" },

ar: [

en: [
  { id: "start", g: "start", title: "Install and activate", lede: "Warshati installs on a Windows PC and works without internet. Internet is only needed to activate it.",
    blocks: [
      { pair: [["activation", "The activation screen"], ["login", "Signing in"]] },
      { h: "Activate the license" },
      { steps: [
        "Install Warshati and open it. The <span class=\"ui\">Software Activation</span> screen appears.",
        "Type the key you received when you bought it (it starts with <b>WARSHATI-</b>) and click <span class=\"ui\">Activate Device</span>.",
        "The key is tied to this PC. Keep it safe: it also recovers the password."
      ] },
      { note: "One key = one PC. To move to another computer, contact us: we free the key for the new PC." },
      { h: "Create the shop (first time)" },
      { steps: [
        "Enter the <b>shop name</b>, phone and address: they appear on tickets and receipts.",
        "Choose the currency (DZD by default) and the default warranty in days (30).",
        "Create the <b>owner account</b>: your name, an email and a password of at least 6 characters.",
        "Sign in with that email and password."
      ] },
      { h: "No internet?" },
      { p: "Warshati checks the license at every start when internet is there. Offline, it keeps working normally for <b>30 days</b> after the last successful check." }
    ] },
  { id: "recover", g: "start", title: "Forgotten password", badge: ["newb"], lede: "The owner forgot their email or password? The license key is enough, even offline.",
    blocks: [
      { shot: "recover", cap: "Recovering the account with the license key" },
      { steps: [
        "On the sign-in screen, click <span class=\"ui\">Forgot your email or password?</span>",
        "Type the shop's license key, then <span class=\"ui\">Continue</span>. Your email appears.",
        "Choose a new password (twice) and save. Sign in with the new password."
      ] },
      { note: "A seller who forgets their password: the owner changes it in <span class=\"ui\">Settings → Users</span>." },
      { warn: "Lost the key too? Message us on WhatsApp: we give it back after checking it is you. After 5 wrong keys, recovery is blocked for 5 minutes." }
    ] },
  { id: "tour", g: "start", title: "Finding your way", lede: "The menu on the left holds everything. The dashboard shows what matters today.",
    blocks: [
      { shot: "dashboard", cap: "Dashboard" },
      { list: [
        "<b>Main</b>: dashboard, customers, inventory, device catalog.",
        "<b>Repairs</b>: check-in, tickets, warranty, trade-ins.",
        "<b>Sales</b>: POS and invoices. <b>Finance</b>: expenses, suppliers, debt ledger, daily close, monthly summary.",
        "<b>Settings</b>: store, users, backup, shop network."
      ] },
      { p: "The dashboard shows pending repairs, today's net profit, unpaid amounts and low stock, with the latest repairs and sales. The buttons at the top start the everyday actions." },
      { h: "Keyboard shortcuts" },
      { table: { head: ["Key", "Action"], rows: [
        ["<kbd>F1</kbd>", "Show every shortcut"], ["<kbd>F2</kbd>", "POS"], ["<kbd>F3</kbd>", "New repair ticket"],
        ["<kbd>F4</kbd>", "New check-in"], ["<kbd>F6</kbd>", "Tickets"], ["<kbd>F7</kbd>", "Inventory"], ["<kbd>F8</kbd>", "Debt ledger"],
        ["<kbd>F9</kbd>", "Daily close"], ["<kbd>Ctrl</kbd> <kbd>K</kbd>", "Go to the search box"], ["<kbd>Esc</kbd>", "Close the window on top"],
        ["<kbd>F10</kbd>", "POS: complete the sale"], ["<kbd>Ctrl</kbd> <kbd>S</kbd> · <kbd>Ctrl</kbd> <kbd>P</kbd>", "Ticket: save · print"]
      ] } },
      { note: "Language: <span class=\"ui\">Settings → Store → Language</span>. English, Français or العربية, no restart needed." }
    ] },
  { id: "repairs", g: "repairs", title: "Take in and follow a repair", lede: "Every device has its ticket, from check-in until it goes back to the customer.",
    blocks: [
      { h: "Quick check-in (when the shop is busy)" },
      { shot: "checkins", cap: "Repairs → Check-In" },
      { steps: [
        "<span class=\"ui\">Check-In</span> (<kbd>F4</kbd>) → <span class=\"ui\">New Check-In</span>.",
        "Customer name and phone, brand and model, IMEI, color, visible condition and the customer's own words about the problem.",
        "Print the check-in receipt for the customer (printer icon).",
        "Later, click <span class=\"ui\">Convert to Ticket</span>: the ticket opens already filled in."
      ] },
      { h: "Create a repair ticket" },
      { shot: "ticket", cap: "An open ticket" },
      { steps: [
        "<span class=\"ui\">New Ticket</span> (<kbd>F3</kbd>), or convert a check-in.",
        "Pick the device from the list (phone, laptop or console) or type it by hand: Warshati will remember it.",
        "Fill in the problem, the device password, the final price, the deposit, the priority and the expected date.",
        "<span class=\"ui\">Save</span> (<kbd>Ctrl</kbd> <kbd>S</kbd>), then <span class=\"ui\">Print Ticket</span> (<kbd>Ctrl</kbd> <kbd>P</kbd>)."
      ] },
      { note: "A customer with the same phone number is found automatically. The deposit counts in today's cash." },
      { h: "The steps of a repair" },
      { flow: ["Diagnosing", "Waiting Parts", "In Repair", "Done", "Delivered"] },
      { list: [
        "Change the step with the <span class=\"ui\">Move to</span> buttons at the top of the ticket.",
        "<b>Done</b> asks for the final price. Then click <span class=\"ui\">Tell customer on WhatsApp</span>: the message with the amount left to pay is ready.",
        "<b>Delivered</b>: choose <b>Cash</b> or <b>Credit</b>. Warshati creates the invoice; anything still owed becomes the customer's debt.",
        "<b>Cancelled</b> stops the ticket. Parts already taken do not go back to stock on their own: remove them first."
      ] },
      { h: "Parts from stock" },
      { p: "In <span class=\"ui\">Parts from stock</span>, choose the part and quantity: it leaves the stock and its cost is added to the ticket's parts cost. The bin puts it back in stock (as long as the ticket is not invoiced)." },
      { shot: "tickets", cap: "Tickets: every repair and its step" }
    ] },
  { id: "warranty", g: "repairs", title: "Warranty", lede: "A customer comes back with the same problem? Find the repair and see at once if it is still under warranty.",
    blocks: [
      { shot: "warranty", cap: "Repairs → Warranty" },
      { steps: [
        "<span class=\"ui\">Warranty</span> → <span class=\"ui\">File Claim</span>. Search by ticket number, IMEI, customer name or phone.",
        "Describe the new problem and, if needed, who is responsible (defect, damage…).",
        "Warshati shows whether the claim is <b>within warranty</b> (delivery date + the ticket's warranty days).",
        "<span class=\"ui\">Create Ticket</span> opens an urgent repair for the same device, free when it is within warranty."
      ] },
      { note: "Only delivered tickets can get a claim. The default warranty is set in Settings → Store." }
    ] },
  { id: "pos", g: "sales", title: "POS (the till)", lede: "Sell an accessory, a part or a phone in seconds, with or without a scanner.",
    blocks: [
      { shot: "pos", cap: "Sales → POS" },
      { steps: [
        "Scan the barcode, or type the name and press <kbd>Enter</kbd>. You can also click an item in the list.",
        "Adjust the quantity and price if needed. Add the customer by phone number (required for a credit sale).",
        "Discount and trade-in credit are taken off the total.",
        "Choose the payment method, type the amount received and click <span class=\"ui\">Complete Sale</span> (<kbd>F10</kbd>).",
        "The receipt prints: <kbd>Enter</kbd> prints it right away."
      ] },
      { h: "Payment methods" },
      { table: { head: ["Method", "When to use it"], rows: [
        ["Cash", "The customer pays everything now."],
        ["Credit (Full)", "The customer pays nothing now: the whole amount becomes their debt."],
        ["Split (Cash + Credit)", "They pay part of it: the rest becomes their debt."]
      ] } },
      { note: "Short on cash? Click <span class=\"ui\">Record the rest as a debt</span>: the sale switches to Split." }
    ] },
  { id: "invoices", g: "sales", title: "Invoices and refunds", lede: "Every sale with its status. A refund puts the items back in stock.",
    blocks: [
      { shot: "invoices", cap: "Sales → Invoices" },
      { list: [
        "Search for an invoice, reprint the receipt, export the list to Excel.",
        "<b>Refund</b> (owner): every item goes back to stock, an open debt on the sale is closed, and Warshati tells you how much to give back.",
        "A repair invoice is not refunded here: use a warranty claim."
      ] },
      { note: "Refunds are always for the whole sale." }
    ] },
  { id: "stock", g: "sales", title: "Inventory", lede: "New and used phones, parts and accessories: stock goes down on its own with every sale and every part used.",
    blocks: [
      { shot: "inventory", cap: "Inventory" },
      { list: [
        "<b>Add</b> (owner): type, name, compatible device, barcode or IMEI, buy and sell price, quantity and low-stock level.",
        "Tick “I paid for this stock today” to record the expense at the same time.",
        "<b>Quick restock</b>: adds quantity and records the expense.",
        "When the quantity reaches the level, the item shows as <b>low stock</b> and appears on the dashboard.",
        "Deactivating an item hides it from lists without erasing its history."
      ] },

/* ---------------------------------------------------------------
   Rendering
   --------------------------------------------------------------- */
const GROUPS = ["start", "repairs", "sales", "money", "admin", "more"];
const params = new URLSearchParams(location.search);
let lang = ["fr", "ar", "en"].includes(params.get("lang")) ? params.get("lang") : "fr";
try { const saved = localStorage.getItem("warshati-lang"); if (!params.get("lang") && saved && T[saved]) lang = saved; } catch (e) {}

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const img = (name) => `/assets/guide/${name}-${lang}.webp`;

function shot(name, cap) {
  const t = T[lang];
  return `<figure class="shot">
    <div class="bar"><i></i><i></i><i></i><span>Warshati — ${esc(cap)}</span></div>
    <button type="button" data-zoom="${img(name)}" aria-label="${esc(t.zoom)}: ${esc(cap)}"><img src="${img(name)}" alt="${esc(cap)}" width="1440" height="900" loading="lazy" decoding="async"></button>
  </figure>`;
}

function block(b) {
  if (b.h) return `<h3>${b.h}</h3>`;
  if (b.p) return `<p class="txt">${b.p}</p>`;
  if (b.steps) return `<ol class="steps">${b.steps.map((s) => `<li><div>${s}</div></li>`).join("")}</ol>`;
  if (b.list) return `<ul class="dots">${b.list.map((s) => `<li><div>${s}</div></li>`).join("")}</ul>`;
  if (b.note) return `<div class="note"><div>${b.note}</div></div>`;
  if (b.warn) return `<div class="warn"><div>${b.warn}</div></div>`;
  if (b.flow) return `<div class="flow">${b.flow.map((s, i) => `${i ? "<i>→</i>" : ""}<span class="${i === b.flow.length - 1 ? "end" : ""}">${esc(s)}</span>`).join("")}</div>`;
  if (b.shot) return shot(b.shot, b.cap);
  if (b.pair) return `<div class="pair">${b.pair.map(([n, c]) => shot(n, c)).join("")}</div>`;
  if (b.table) return `<div class="tbl"><table><thead><tr>${b.table.head.map((h) => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${b.table.rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  if (b.faq) return b.faq.map(([q, a]) => `<details class="faq"><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join("");
  if (b.plans) return `<div class="plans">${b.plans.map(([name, price, sub, items], i) => `<div class="plan${i === 2 ? " vip" : ""}"><h3>${esc(name)}</h3><div class="price"><bdi>${esc(price)}</bdi><small>${esc(sub)}</small></div><ul>${items.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>`).join("")}</div>`;
  return "";
}

function render() {
  const t = T[lang];
  const chapters = C[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.title = lang === "ar" ? "دليل ورشتي — Warshati" : (lang === "fr" ? "Guide Warshati — ورشتي" : "Warshati guide — ورشتي");
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t[el.dataset.t] ?? ""; });
  document.querySelectorAll("[data-th]").forEach((el) => { el.innerHTML = t[el.dataset.th] ?? ""; });
  document.querySelectorAll("[data-tp]").forEach((el) => { el.placeholder = t[el.dataset.tp] ?? ""; });
  document.querySelectorAll("a[data-reg]").forEach((a) => { a.href = "/register?lang=" + lang; });
  document.querySelectorAll(".langs button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  document.getElementById("toc").setAttribute("aria-label", t.toc);

  const num = (i) => String(i + 1).padStart(2, "0");
  document.getElementById("quick").innerHTML = t.quick.map(([id, n, title, sub]) => {
    const i = chapters.findIndex((c) => c.id === id);
    return `<a href="#${id}"><i>${i >= 0 ? num(i) : n}</i><b>${esc(title)}</b><span>${esc(sub)}</span></a>`;
  }).join("");

  document.getElementById("chapters").innerHTML = chapters.map((c, i) => {
    const badges = (c.badge || []).map((k) => `<span class="badge ${k === "newb" ? "new" : k}">${esc(k === "newb" ? t.newb : k === "vip" ? t.vip : t.owner)}</span>`).join("");
    return `<section class="chap" id="${c.id}" data-g="${c.g}">
      <header>
        <p class="eyebrow">${num(i)} · ${esc(t.groups[c.g])}</p>
        <h2>${esc(c.title)}</h2>
        ${badges ? `<div class="badges">${badges}</div>` : ""}
        <p class="lede">${c.lede}</p>
      </header>
      ${c.blocks.map(block).join("")}
    </section>`;
  }).join("");

  document.getElementById("toc").innerHTML = GROUPS.map((g) => {
    const items = chapters.map((c, i) => [c, i]).filter(([c]) => c.g === g);
    return `<div class="grp">${esc(t.groups[g])}</div>` + items.map(([c, i]) => `<a href="#${c.id}" data-id="${c.id}"><span>${num(i)}</span>${esc(c.title)}</a>`).join("");
  }).join("");

  document.getElementById("picker").innerHTML = `<option value="">${esc(t.toc)}…</option>` +
    GROUPS.map((g) => `<optgroup label="${esc(t.groups[g])}">` + chapters.map((c, i) => [c, i]).filter(([c]) => c.g === g).map(([c, i]) => `<option value="${c.id}">${num(i)} · ${esc(c.title)}</option>`).join("") + `</optgroup>`).join("");

  filter();
  watchSections();
}

/* Search: keeps the chapters whose text has every typed word (accents and case ignored) */
const fold = (s) => s.toLowerCase().normalize("NFD").replace(/[̀-ًͯ-ْ]/g, "");
function filter() {
  const q = document.getElementById("q").value.trim();
  const words = fold(q).split(/\s+/).filter(Boolean);
  let shown = 0;
  document.querySelectorAll(".chap").forEach((sec) => {
    const hit = !words.length || words.every((w) => fold(sec.textContent).includes(w));
    sec.hidden = !hit;
    document.querySelectorAll(`.toc a[data-id="${sec.id}"]`).forEach((a) => { a.hidden = !hit; });
    if (hit) shown++;
  });
  const empty = document.getElementById("empty");
  empty.hidden = shown > 0;
  if (!shown) empty.innerHTML = `<b>${esc(T[lang].empty.replace("{q}", q))}</b><span>${esc(T[lang].empty_help)}</span>`;
}

/* Highlight the chapter being read */
let observer;
function watchSections() {
  observer?.disconnect();
  observer = new IntersectionObserver((entries) => {
    entries.forEach((e) => {
      if (!e.isIntersecting) return;
      document.querySelectorAll(".toc a").forEach((a) => a.setAttribute("aria-current", String(a.dataset.id === e.target.id)));
    });
  }, { rootMargin: "-20% 0px -70% 0px" });
  document.querySelectorAll(".chap").forEach((s) => observer.observe(s));
}

function setLang(l) {
  lang = l;
  try { localStorage.setItem("warshati-lang", l); } catch (e) {}
  const here = location.hash;
  render();
  if (here) document.getElementById(here.slice(1))?.scrollIntoView();
}

document.querySelectorAll(".langs button").forEach((b) => b.addEventListener("click", () => setLang(b.dataset.lang)));
document.getElementById("q").addEventListener("input", filter);
document.getElementById("picker").addEventListener("change", (e) => { if (e.target.value) location.hash = e.target.value; e.target.value = ""; });

// Enlarge a screenshot
const zoom = document.getElementById("zoom");
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-zoom]");
  if (!b) return;
  document.getElementById("zoom-img").src = b.dataset.zoom;
  document.getElementById("zoom-img").alt = b.querySelector("img")?.alt || "";
  zoom.showModal();
});
document.getElementById("zoom-close").addEventListener("click", () => zoom.close());
zoom.addEventListener("click", (e) => { if (e.target === zoom) zoom.close(); });

// Back to top
const up = document.getElementById("up");
window.addEventListener("scroll", () => up.classList.toggle("show", window.scrollY > 900), { passive: true });
up.addEventListener("click", () => window.scrollTo({ top: 0 }));

render();
// Opened on a chapter link: go there now, and again once fonts and layout have settled
const toHash = () => { if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView(); };
toHash();
window.addEventListener("load", () => requestAnimationFrame(toHash));
</script>
